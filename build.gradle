plugins {
    id 'application'
}

group = 'br.ufc.so'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.ufc.so.escalonamento.Main'
}

// Os processos são lidos de stdin (ADR 0005); sem isso, o Gradle não repassa a entrada.
tasks.named('run') {
    standardInput = System.in
}

// Interface gráfica (ADR 0007): ponto de entrada separado, sem alterar o contrato de terminal.
def guiMainClass = 'br.ufc.so.escalonamento.gui.GuiMain'

tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Executa a interface gráfica do simulador.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = guiMainClass
}

def guiStartScripts = tasks.register('guiStartScripts', CreateStartScripts) {
    applicationName = 'simulador-escalonamento-gui'
    mainClass = guiMainClass
    outputDir = layout.buildDirectory.dir('gui-scripts').get().asFile
    classpath = files(tasks.named('jar')) + configurations.runtimeClasspath
}

distributions {
    main {
        contents {
            from(guiStartScripts) {
                into 'bin'
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Os testes da interface desenham em memória, sem abrir janelas.
    systemProperty 'java.awt.headless', 'true'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}
